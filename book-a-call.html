<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>

<title>Work With Me | Book a Free Discovery Call | Joy Irine Barnayha</title>
<meta name="description" content="Book a free discovery call with Joy Irine Barnayha, AI Automation Specialist in the Philippines. Done-for-you AI agents, voice callers, and n8n/GoHighLevel workflows."/>
<meta property="og:title" content="Work With Me | Book a Free Discovery Call | Joy Irine Barnayha"/>
<meta property="og:description" content="Book a free discovery call with Joy Irine Barnayha, AI Automation Specialist in the Philippines. Done-for-you AI agents, voice callers, and n8n/GoHighLevel workflows."/>
<meta property="og:image" content="https://joyirinebarnayha.com/images/portfolio-og-preview.jpg"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="545"/>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--mg:#8B004B;--mg2:#a8005a;--gold:#edb92e;--bg:#080808;}
html,body{background:#080808;color:#fff;font-family:'Montserrat',sans-serif;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
nav{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid rgba(139,0,75,0.3);background:#0f0f0f;}
.back{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.82);transition:color .2s;}
.back:hover{color:var(--mg2);}
.brand{font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;}
.brand span{color:var(--mg2);}
.wrap{max-width:900px;margin:0 auto;padding:50px 20px 70px;text-align:center;}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:12px;}
h1 span{color:var(--mg2);}
p{color:rgba(255,255,255,0.6);font-size:15px;margin-bottom:36px;}
.calendly-inline-widget{min-width:280px;height:700px;border-radius:12px;overflow:hidden;background:#111;}
.wa-alt{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:12px 24px;border-radius:30px;background:var(--mg);color:#fff;font-weight:700;font-size:14px;}
.wa-alt:hover{background:var(--mg2);}
@media(max-width:600px){
  nav{padding:0 16px;gap:10px;}
  .back{font-size:10px;letter-spacing:1px;}
  .brand{font-size:10px;letter-spacing:1.2px;}
}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<nav>
  <a href="/" class="back">&larr; Back to Home</a>
  <div class="brand">Joy Irine <span>Barnayha</span></div>
</nav>

<div class="wrap">
  <h1>Let's Book A <span>Call</span></h1>
  <p>Pick a time that works for you — I'll walk you through how automation can run your business on autopilot.</p>
  <div class="calendly-inline-widget" data-url="https://calendly.com/jirineautomationservices/30min"></div>
  <a href="https://wa.me/639204826475?text=Hi+Joy!+I%27d+like+to+book+a+call." target="_blank" class="wa-alt" id="wa-alt-btn">Message me on WhatsApp instead</a>
</div>

<script>
(function(){
  var va = new URLSearchParams(window.location.search).get('va');
  if (va) {
    try { sessionStorage.setItem('va_ref', va); } catch(e){}
  } else {
    try { va = sessionStorage.getItem('va_ref'); } catch(e){}
  }
  if (va) {
    var el = document.querySelector('.calendly-inline-widget');
    if (el) el.setAttribute('data-url', el.getAttribute('data-url') + '?utm_source=va' + va);
    document.querySelectorAll('a[href^="https://wa.me/"]').forEach(function(a){
      a.setAttribute('href', a.getAttribute('href') + encodeURIComponent(' (ref: ' + va + ')'));
    });
  }
})();
</script>
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
<script>
// WhatsApp alert to Joy when someone books here (Calendly tells the page when a booking is done).
(function(){
  var q = new URLSearchParams(window.location.search), src = q.get('src');
  try { if (src) sessionStorage.setItem('book_src', src); else src = sessionStorage.getItem('book_src'); } catch(e){}
  window.addEventListener('message', function(e){
    if (e.origin !== 'https://calendly.com' || !e.data || e.data.event !== 'calendly.event_scheduled') return;
    var p = e.data.payload || {};
    fetch('https://automatedjirine.app.n8n.cloud/webhook/site-booking', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ src: src || 'nav', h: (function(){ try { return localStorage.getItem('sn_h') || ''; } catch(e){ return ''; } })(), event_uri: (p.event && p.event.uri) || '', invitee_uri: (p.invitee && p.invitee.uri) || '' })
    }).catch(function(){});
  });
})();
</script>

</body>
</html>
